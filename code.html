<!DOCTYPE html>
<html>
<head>
    <title>Egg Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

```
<div class="egg-timer">

    <h1 class="title">🥚 Egg Timer</h1>

    <p class="description">Perfect egg every time</p>

    <h2 class="timer">05:00</h2>

    <p class="choose-text">Choose your egg:</p>

    <div class="egg-buttons">
        <button class="egg-button">Soft</button>
        <button class="egg-button">Medium</button>
        <button class="egg-button">Hard</button>
    </div>

    <button class="start-button">Start Timer</button>

    <button class="reset-button">Reset</button>

</div>
```
 <script src="script.js"></script>
</body>

</html>
